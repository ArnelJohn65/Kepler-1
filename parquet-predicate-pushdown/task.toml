schema_version = "1.0"
artifacts = ["/app/results.json", "/app/trace.jsonl"]

[task]
name = "afterquery/parquet-predicate-pushdown"
version = "1.0.0"

[environment]
gpus = 0

[agent]
timeout_sec = 18000

[verifier]
environment_mode = "separate"

[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 10
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "This task is harder because correctness and pruning both require multiple interacting pieces to be right at the same time. The dataset is synthetic and deterministic from a fixed seed, but it is substantially larger now at 192 row groups of 640 rows each, with nullable columns, NaN values, decimal values, timestamp-with-timezone values, and row groups where selected columns intentionally have no Parquet statistics. The query suite mixes NOT over OR over IN with nulls, correlated multi-column constraints, and cases where a row group must still be read even when it contributes zero output rows. A solver that handles only one aspect, like simple min/max pruning, will return plausible but wrong read sets and fail. This mirrors work done by storage-engine and query-optimizer engineers building pushdown and pruning logic in real analytical systems."
solution_explanation = "The solution builds a row-group index directly from the Parquet file by scanning each row group once, collecting min/max/null-count metadata, distinct value sets for dictionary-like columns, NaN/null presence flags, and selected pairwise value combinations for correlated columns. It then evaluates each predicate tree with a three-valued may-be-true lattice plus pair-feasibility checks to decide which row groups are provably prunable. For row groups that must be read, it decodes only required columns, applies the predicate to rows, preserves scan order, and emits both result rows and cryptographic receipts. Receipt chaining is computed exactly as specified so the verifier can independently recompute and validate every reported read."
verification_explanation = "The verifier runs in a separate container and generates its own pristine dataset and query spec at image build time from the same deterministic seed script used by the environment. It grades only the declared agent artifacts /app/results.json and /app/trace.jsonl. The tests validate exact output schemas, exact row contents and order per query, per-query read budgets, and receipt integrity from independently decoded verifier-side bytes. For row-group reporting, grading uses a soundness band: every row group that truly contains at least one matching row must be present in read_row_groups, and total reported reads must stay within each query's max_row_groups_read budget. The verifier does not require matching one specific pruning algorithm."
