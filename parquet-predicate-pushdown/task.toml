schema_version = "1.0"
artifacts = ["/app/results.json", "/app/trace.jsonl"]

[task]
name = "afterquery/parquet-predicate-pushdown"
version = "1.0.0"

[environment]
gpus = 0

[agent]
timeout_sec = 14400

[verifier]
environment_mode = "separate"

[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 14
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "This task requires building a complete row-group pruning layer from scratch — not patching a near-complete implementation. The agent must design and persist a secondary index (value sets, null flags), implement a predicate tree evaluator over that index with correct three-valued null semantics, and emit cryptographic receipts that the verifier recomputes from Parquet bytes. The dataset has 32 row groups of 500 rows each, with compound AND/OR/NOT predicate trees, IN lists, IS NULL, correlated multi-column filters, and row groups with legitimately absent statistics. Naive min/max zone-map pruning cannot meet the max_row_groups_read targets without the value-set index. For a human expert, the challenge is designing correct prune rules for NOT and OR subtrees and validating null corner cases."
solution_explanation = "The solution builds a value-set index from Parquet row-group metadata at startup, evaluates compound predicate trees over that index to prune row groups, decodes only non-pruned row groups, filters rows in memory, computes per-row-group cryptographic receipts from decoded bytes, chains them into per-query receipts, and writes results.json and trace.jsonl."
verification_explanation = "The verifier is a separate-container pytest suite. It bakes in its own pristine copy of the dataset by running generate.py (deterministic, seeded) at image build time into /tests/data/. It never reads from the agent container except for the two declared artifacts /app/results.json and /app/trace.jsonl. For each query it runs a reference full scan from /tests/data/sales.parquet to compute expected rows, compares exact row sets against the agent results, recomputes row-group receipts from /tests/data/sales.parquet bytes and verifies them against trace entries, and checks that read_row_groups count does not exceed max_row_groups_read. A forged trace is rejected because receipts are computed from actual decoded Parquet bytes the verifier reads independently."
