schema_version = "1.0"
artifacts = ["/app/results.json", "/app/trace.jsonl", "/app/row_group_index.pkl"]

[task]
name = "afterquery/parquet-predicate-pushdown"
version = "1.0.0"

[environment]
gpus = 0

[agent]
timeout_sec = 18000

[verifier]
environment_mode = "separate"

[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 10
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "This task is harder because the task contract now has real anti-cheat constraints in addition to correctness and pruning budgets. The runner physically hides /app/data/queries.json during the build pass, so the index must be generic and cannot be precomputed from the exact workload. The verifier also caps the persisted index artifact size, which blocks solutions that serialize large slices of raw column data instead of compact pruning metadata. On top of that, the solution still has to return exact rows in order, report every matching row group, stay within max_row_groups_read and max_decoded_bytes, and produce receipts that the verifier recomputes independently from decoded query-phase bytes."
solution_explanation = "The solution uses two passes with a persisted index at /app/row_group_index.pkl. During build it scans every row group once while queries.json is hidden, and stores compact metadata such as min and max statistics, distinct sets for selected low-cardinality columns, null and NaN flags, and a few pairwise value sets. During query it loads that index, evaluates each predicate with a conservative may-be-true pruner, decodes only the receipt columns for surviving row groups, applies the predicate, projects the requested columns, and writes results plus per-row-group receipts."
verification_explanation = "The verifier runs in a separate container with its own regenerated dataset and query spec, and grades /app/results.json, /app/trace.jsonl, and /app/row_group_index.pkl. It checks exact result contents and ordering, trace schema, strictly increasing row-group reads, result_count consistency, receipt recomputation, query receipt chaining, coverage of every matching row group, and both per-query budgets. It also enforces that the persisted index artifact exists and stays under a fixed size ceiling, which blocks materialized-data cheats even if they never exceed query-time budgets. Together with the build-time information barrier, that makes the anti-cheat rules enforceable instead of advisory."
