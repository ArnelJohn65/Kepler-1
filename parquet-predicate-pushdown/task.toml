schema_version = "1.0"
artifacts = ["/app/results.json", "/app/trace.jsonl"]

[task]
name = "afterquery/parquet-predicate-pushdown"
version = "1.0.0"

[environment]
gpus = 0

[agent]
timeout_sec = 18000

[verifier]
environment_mode = "separate"

[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 10
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "This task is harder because correctness and performance constraints have to hold together. The data is synthetic and deterministic from a fixed seed, with 192 row groups of 640 rows each, nullable columns, NaN values, decimals, timestamps, and mixed predicate shapes. The query set was redesigned so every query is selective, with matching row groups as a minority and tight read and decoded-byte ceilings. A min/max-only pruner over-reads and fails budgets, while a full-scan query pass is too slow under the query-phase runner budget. This is realistic for storage and query-engine work where teams build one-time metadata indexes then rely on them to keep repeated query-time scans within strict SLO and resource limits."
solution_explanation = "The solution uses two passes. In the build pass it scans every row group once and writes a persisted index containing stats, distinct value sets, null and NaN flags, and selected pairwise value sets. In the query pass it loads that index, prunes row groups with a three-valued may-be-true evaluator, decodes only required columns for surviving groups, applies predicates, and writes ordered results. It emits row-group receipts, decoded row counts, decoded byte counts, and a chained query receipt so the verifier can recompute and validate each reported query-phase decode."
verification_explanation = "The verifier runs in a separate container with its own pristine dataset and query spec generated at build time. It grades only /app/results.json and /app/trace.jsonl. Tests enforce exact row contents and ordering, strict artifact schemas, strictly increasing row-group traces, receipt recomputation from independently decoded verifier-side bytes, and query receipt chaining. For each query, the verifier enforces three outcome constraints: every matching row group must be reported, read-row-group count must stay within max_row_groups_read, and total reported decoded bytes must stay within max_decoded_bytes. This keeps grading algorithm-agnostic while making over-reading detectable through hard resource ceilings."
