schema_version = "1.0"
artifacts = ["/app/results.json", "/app/row_group_index.json"]

[task]
name = "afterquery/parquet-predicate-pushdown"
version = "1.0.0"

[environment]
gpus = 0

[agent]
timeout_sec = 18000

[verifier]
environment_mode = "separate"

[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 10
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "The hard part is conservative pruning of arbitrary and, or, and not predicate trees from a persisted row group index without ever excluding a row group that could still produce a match. The logic has to respect three-valued null behavior, NaN behavior, and columns where parquet statistics are deliberately absent, so simple min and max filtering is not enough. The data is synthetic from a seeded generator, so it is cleaner than a real warehouse table, but the edge cases and proof obligations are realistic enough to make the pruning problem genuinely challenging. This is the kind of work query engine, storage engine, and lakehouse developers do when they implement predicate pushdown and prove it is conservative."
solution_explanation = "The reference solution writes /app/row_group_index.json in the declared plain-data schema. For each row group it stores exact null counts, available min and max bounds, distinct values for the low-cardinality string and integer columns, NaN flags for floating columns, and selected exact pairwise value sets. For the visible queries it loads that JSON index, keeps every row group the index still considers possibly matching, evaluates the predicate against those survivors, and writes exact projected rows in row group order."
verification_explanation = "The verifier runs in a separate container with its own seeded copy of sales.parquet, the visible queries for results.json checking, and a hidden query set that is never copied into the agent image. It grades /app/results.json for exact visible-query correctness, then grades /app/row_group_index.json on the hidden queries by replaying the declared index semantics. Any hidden query that loses a real matching row group is an immediate failure. The persisted index cap is exactly 2097152 bytes. The reference JSON index measures 1567082 bytes, so the margin is 530070 bytes, about 33.8 percent. The hidden-query precision ceilings are calibrated directly from the reference index survivor counts on the verifier dataset: h1<=10, h2<=4, h3<=16, h4<=7, h5<=4, h6<=14, h7<=8, h8<=4, h9<=1, h10<=4, h11<=4, h12<=14. A stronger index may leave fewer survivors and still pass. A min/max-only index exceeds those ceilings, while a materialized-data index exceeds the size cap."
