[metadata]
author_name = "Arnel John Mengote"
author_email = "arneljohn65@outlook.com"
relevant_experience = "I've spent 13 years building and debugging data pipelines across Redshift, BigQuery, Snowflake, Spark, and Databricks, which means I've read a lot of query plans and chased a lot of wrong-results bugs. At Qantas I migrated airline booking, fare, CRM and operational datasets from Redshift to BigQuery with parallel-run validation, so I know what it takes to prove that a rewritten engine returns identical numbers. At Insurity and UHS I built dbt star schemas and SCD2 marts on Snowflake and Databricks where null handling and boundary conditions in predicate pushdown were the exact class of bugs that caused silent data loss. That background makes it straightforward for me to judge whether a row-group pruning implementation is actually correct or just passes easy cases."
difficulty_explanation = "This task combines correctness and optimizer work under strict trace validation. The predicates are nested boolean trees with AND/OR/NOT, IN lists, and null checks. Row-group pruning requires combining Parquet min/max statistics with a persisted per-row-group value index, while keeping SQL null semantics correct. The dataset is synthetic but seeded and large enough to have many row groups, so weak pruning strategies miss verifier targets. For a human expert, most time goes to designing safe prune rules for nested predicates and validating edge cases. For an agent, the hard part is implementing the tree evaluator, the pruning planner, and deterministic trace receipts without over-pruning. This is the kind of work done by database engine, storage, and query performance engineers."
solution_explanation = "The solution runs a standalone Python program from solution/solve.py. It loads queries, reads Parquet row-group metadata, loads the persisted row-group value index, evaluates predicates with full SQL-like null behavior, and prunes row groups only when a match is impossible. For each read row group it computes a deterministic receipt from decoded values and emits one structured trace record per query. It then writes full query outputs to /app/results.json and trace records to /app/trace.jsonl."
verification_explanation = "The verifier is a pytest suite. It first validates results.json and trace.jsonl against the required schemas. It computes reference results by full scanning the dataset with an internal reference evaluator, then compares every query row set and exact row count. It verifies trace receipts per query and per row group by recomputing decoded-row checksums from the underlying Parquet bytes and checking query-level receipt chains. It also checks per-query pruning requirements declared in /app/data/queries.json (max_row_groups_read) and rejects traces that exceed them. A bundled cheat script demonstrates that full-scan output plus forged trace is rejected."
category = "Software"
subcategory = "Databases"
tags = ["databases", "query-optimization", "python", "parquet", "storage-engines"]
expert_time_estimate_hours = 14
